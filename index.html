<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&family=Slackey&display=swap" rel="stylesheet">
    <title>tunes player</title>
    <link rel="stylesheet" href="./stylesheet.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class = "header">
        <img src = "images/musicnote.png" alt = "music note" class = "musicNote">

        <h1>TunesPlayer</h1>  
    </div>
    <div>
      <h2 class = "playlistHeader">Songs</h2>
      <div class="musiclist">
          <audio id="moonSong" src="songs/onthemoon.mp3"></audio>
          <audio id="armedSong" src="songs/armedandready.mp3"></audio>

          <div class="song-row">
              <img src="images/moon.jpg" class="song-icon">
              <div class = "song-info">
                <div>
                  <h3>On The Moon by:</h3>
                  <h3>Chromaa ft. MIGURIMA</h3>
                </div>
              <button onclick="playMoonMusic()">PLAY</button>
          </div>
        </div>
          <div class="song-row">
              <img src="images/rwby.webp" class="song-icon">
              <div class="song-info">
                <div>
                  <h3>Armed and Ready by:</h3>
                  <h3>Jeff Williams ft. Casey Lee Williams</h3>
                </div>

                <button onclick="playArmedMusic()">PLAY</button>
              </div>
          </div>
      </div>
      </div>
  </body>
</html>
